name: Release (Play Store bundle)

# Builds the signed Android App Bundle (.aab) to upload to Google Play.
# Run it from the Actions tab ("Run workflow"), or push a tag like v1.0.0.
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   ANDROID_KEYSTORE_BASE64   base64 of the upload keystore (.jks)
#   ANDROID_KEYSTORE_PASSWORD keystore password
#   ANDROID_KEY_ALIAS         key alias (e.g. upload)
#   ANDROID_KEY_PASSWORD      key password
# See docs/PLAY_STORE.md for how to create them.

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  bundle:
    name: Signed app bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.9
          channel: stable
          cache: true

      - name: Restore upload keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secret ANDROID_KEYSTORE_BASE64 is missing — see docs/PLAY_STORE.md"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"

      - run: flutter pub get

      - name: Build signed app bundle
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        # Obfuscated Dart; the symbols are kept so crash stack traces can be decoded.
        run: flutter build appbundle --release --obfuscate --split-debug-info=build/symbols

      - name: Verify the bundle is signed with the upload key
        run: |
          jarsigner -verify -verbose:summary build/app/outputs/bundle/release/app-release.aab | tail -5
          if keytool -printcert -jarfile build/app/outputs/bundle/release/app-release.aab | grep -q "CN=Android Debug"; then
            echo "::error::Bundle is signed with the debug key"; exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: parichit-release-${{ github.ref_name }}-${{ github.run_number }}
          path: |
            build/app/outputs/bundle/release/app-release.aab
            build/symbols/
          retention-days: 30

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks"
