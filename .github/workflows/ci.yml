name: CI

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kinship:
    name: Kinship engine (pure Dart)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/kinship
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.9
          channel: stable
          cache: true
      - run: dart pub get
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: dart analyze --fatal-infos
      - run: dart test

  android-release-build:
    name: Android release build (smoke test)
    # Proves the release pipeline (R8, plugins, signing config) still works.
    # Without the upload-key secrets it signs with the debug key — not uploadable.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.9
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build appbundle --release

  app:
    name: App (analyze + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.9
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Format (hand-written code only)
        run: dart format --output=none --set-exit-if-changed $(find lib test -name '*.dart' ! -name '*.g.dart' ! -path '*/l10n/generated/*')
      - name: Generated code is up to date
        run: |
          dart run build_runner build
          git diff --exit-code -- '*.g.dart' lib/l10n/generated
      - run: flutter analyze --fatal-infos
      - name: Test
        run: flutter test --coverage --file-reporter json:build/test-results.json
      - name: Annotate failed tests
        # Turns each failing test into a GitHub annotation (name, error and
        # stack trace), visible on the run page and through the checks API.
        if: failure()
        run: |
          python3 - <<'EOF'
          import json, os
          path = 'build/test-results.json'
          if not os.path.exists(path):
              raise SystemExit(0)
          suites, tests, prints = {}, {}, {}
          for line in open(path, encoding='utf-8'):
              try:
                  e = json.loads(line)
              except ValueError:
                  continue
              kind = e.get('type')
              if kind == 'suite':
                  suites[e['suite']['id']] = e['suite'].get('path', '?')
              elif kind == 'testStart':
                  tests[e['test']['id']] = e['test']
              elif kind == 'print':
                  # Flutter reports widget-test exceptions as printed output.
                  prints.setdefault(e.get('testID'), []).append(e.get('message', ''))
              elif kind == 'error':
                  test = tests.get(e.get('testID'), {})
                  file = suites.get(test.get('suiteID'), '?').split('/test/')[-1]
                  title = f"{file} :: {test.get('name', '?')}".replace('%', '%25').replace(':', '%3A').replace(',', '%2C')
                  output = '\n'.join(prints.get(e.get('testID'), []))
                  body = (output[:3500] + '\n---\n' + e.get('error', '') + '\n' + e.get('stackTrace', ''))[:6000]
                  body = body.replace('%', '%25').replace('\r', '').replace('\n', '%0A')
                  print(f'::error title={title}::{body}')
          EOF
